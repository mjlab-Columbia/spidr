# email to which errors will be sent
email: "dsg2157@columbia.edu"

# Location of the config file for barcodeIdentification
bID: "config_6_rounds_K562.txt"

# Location of the samples json file produced with the fastq2json.py script 
experiments: "experiments_part4.json"

# Output directory  
output_dir: ""

# Temporary directory
temp_dir: "/burg/mjlab/projects/spidr-runs/dsg2157/original_k562/"

# Unique tags in the ROUND1 tags within config
conditions: ['BLANK']

# Currently "mm10" and "hg38" available
assembly: "hg38"

proportion: 0.5

min_oligos: 1

# Number of barcodes used
num_tags: "7"

# Number of chunks to split fastq
num_chunks: 50

# Maximum sise of bead clusters
max_size: 10000

# Format for splitting clusters
rounds_format: 'format_6_rounds_K562.txt'

# File for cutadapt
cutadapt_oligos: "reference/oligo2_reverse.fasta"

read1_start_offset: 0

read2_start_offset: 0

read1_format: "DPM"

read2_format: "Y|SPACER|ODD|SPACER|EVEN|SPACER|ODD|SPACER|EVEN|SPACER|ODD"

# Bowtie2 Indexes
# Note: mm10 index currently not available at specified filepath
bowtie2_index:
    hg38: "/burg/mjlab/projects/spidr-alignment-indices/ncRNA_bt2/ncRNA"
    mm10: "/burg/mjlab/projects/spidr-alignment-indices/mm10_ncRNA_bt2/mm10_ncRNA"

# Star Indexes
# Note: mm10 index currently not available at specified filepath
star_index:
    mm10: "/burg/mjlab/projects/spidr-alignment-indices/mus_musculus/GRCm38/star"
    hg38: "/burg/mjlab/projects/spidr-alignment-indices/GRCh38/star"
